metrics:
  slot_minutes: 15
  dwell_time_minutes: 60
  max_allowed_seat_proportion: 0.70
  forward_traffic_hours: 3
  high_utilisation_threshold: 0.53

  # "fixed" gives a like-for-like quadrant boundary. "pre_percentile" derives
  # one rounded threshold from target-airport pre-period peaks and reuses it
  # for both periods.
  traffic_threshold_mode: "fixed"
  high_traffic_threshold: 30
  traffic_percentile: 70

snowflake:
  # true: local user-profile SSO (externalbrowser).
  # false: non-human user via AWS Secrets Manager private-key credentials.
  is_run_locally: true
  account: "a7074875169861-prod.privatelink"
  warehouse: "WH_GODFREY_LEUNG"
