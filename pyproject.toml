[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capacity-intervention-impact"
version = "0.1.0"
description = "Paired pre/post analysis for capacity-constrained lounges"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "snowflake-connector-python[pandas]>=3.0",
    "boto3>=1.28",
    "cryptography>=41.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dashboard = ["streamlit>=1.28", "plotly>=5.18"]

[project.scripts]
capacity-impact = "capacity_impact.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
